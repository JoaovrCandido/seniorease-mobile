name: CI - Qualidade e Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validação de Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar Tipagem (TypeScript)
        # O tsc --noEmit apenas verifica os erros sem gerar ficheiros .js compilados
        run: npx tsc --noEmit

      - name: Executar Testes Unitários
        run: npm run test
