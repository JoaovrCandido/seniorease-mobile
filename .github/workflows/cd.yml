name: CD - Build e Deploy (EAS)

on:
  workflow_dispatch: # Permite disparar o build manualmente no GitHub
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Gerar Build (Expo EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Configurar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm ci

      - name: Build Android (Preview)
        # Ajuste "--profile preview" para "--profile production" quando for enviar para a loja
        run: eas build --platform android --profile preview --non-interactive
